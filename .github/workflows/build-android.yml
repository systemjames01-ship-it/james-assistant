name: Build Jâmes Android APK

on:
  pull_request:
    paths:
      - 'android/**'
      - 'worker.js'
      - 'index.html'
      - 'hologram-v24.js'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'worker.js'
      - 'index.html'
      - 'hologram-v24.js'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT/platforms/android-35" ] || [ ! -d "$SDK_ROOT/build-tools/35.0.0" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
            test -n "$SDKMANAGER" || { echo "sdkmanager não encontrado em $SDK_ROOT"; exit 1; }
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
        working-directory: android
      - name: Verify APK output
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK bytes: $(stat -c%s "$APK")"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: james-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  emulator-smoke:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: james-android-debug
          path: apk
      - name: Launch and navigate the Android app in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r apk/app-debug.apk
            adb shell am start -n com.james.assistant/.MainActivity
            sleep 8
            adb shell pidof com.james.assistant
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml window.xml >/dev/null
            python3 - <<'PY'
            import re
            import subprocess
            import time
            import xml.etree.ElementTree as ET

            def dump():
                subprocess.run(["adb", "shell", "uiautomator", "dump", "/sdcard/window.xml"], check=True, stdout=subprocess.DEVNULL)
                subprocess.run(["adb", "pull", "/sdcard/window.xml", "window.xml"], check=True, stdout=subprocess.DEVNULL)
                return ET.parse("window.xml").getroot()

            def tap_text(label):
                root = dump()
                for node in root.iter("node"):
                    if node.attrib.get("text", "").strip() == label:
                        bounds = node.attrib.get("bounds", "")
                        numbers = [int(value) for value in re.findall(r"\d+", bounds)]
                        if len(numbers) != 4:
                            continue
                        x = (numbers[0] + numbers[2]) // 2
                        y = (numbers[1] + numbers[3]) // 2
                        subprocess.run(["adb", "shell", "input", "tap", str(x), str(y)], check=True)
                        time.sleep(2)
                        return dump()
                raise SystemExit("UI element not found: " + label)

            def texts(root):
                return [node.attrib.get("text", "") for node in root.iter("node")]

            root = dump()
            for required in ("JÂMES", "CHAT", "CONTROLE", "LIGAR JÂMES"):
                if required not in texts(root):
                    raise SystemExit("Missing Android home UI element: " + required)

            root = tap_text("CHAT")
            if "NOVA CONVERSA" not in texts(root):
                raise SystemExit("Chat view did not expose the new-conversation control.")

            root = tap_text("CONTROLE")
            if "PERFIL PESSOAL E SINCRONIZAÇÃO" not in texts(root):
                raise SystemExit("Control view did not expose profile pairing.")

            root = tap_text("JÂMES")
            if "LIGAR JÂMES" not in texts(root):
                raise SystemExit("Home view did not return after navigation.")

            logs = subprocess.run(["adb", "logcat", "-d"], check=True, capture_output=True, text=True).stdout
            if "FATAL EXCEPTION" in logs:
                raise SystemExit("Android app crashed during emulator smoke test.")

            services = subprocess.run(["adb", "shell", "dumpsys", "activity", "services"], check=True, capture_output=True, text=True).stdout
            if "JamesSessionService" in services:
                raise SystemExit("Sensors/session service started without explicit ON action.")

            print("Android emulator smoke passed: home, chat, control, profile pairing, no sensor auto-start.")
            PY
