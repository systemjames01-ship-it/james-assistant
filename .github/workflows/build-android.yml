name: Build Jâmes Android APK

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT/platforms/android-35" ] || [ ! -d "$SDK_ROOT/build-tools/35.0.0" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
            test -n "$SDKMANAGER" || { echo "sdkmanager não encontrado em $SDK_ROOT"; exit 1; }
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
        working-directory: android
      - name: Verify APK output
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK bytes: $(stat -c%s "$APK")"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: james-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
