name: Deploy Jâmes to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - 'migrations/**'
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Digite exatamente DEPLOY_JAMES_AI_V22 para autorizar a publicação"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: james-ai-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirm_production == 'DEPLOY_JAMES_AI_V22' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do commit validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar código e testes
        run: npm test

      - name: Conferir credenciais sem exibi-las
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f856fa8ecd90e4f82fb42d0732c7f723
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Falta o segredo CLOUDFLARE_API_TOKEN no GitHub."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Falta o CLOUDFLARE_ACCOUNT_ID no ambiente do workflow."; exit 1; }
          echo "Credenciais presentes; valores ocultos."

      - name: Aplicar migração aditiva do histórico de conversas no D1 remoto
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f856fa8ecd90e4f82fb42d0732c7f723
        run: npx --yes wrangler@4 d1 execute james-memory --remote --file=migrations/0001_james_conversation_messages_v21.sql

      - name: Aplicar migração aditiva de tarefas no D1 remoto
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f856fa8ecd90e4f82fb42d0732c7f723
        run: npx --yes wrangler@4 d1 execute james-memory --remote --file=migrations/0002_james_tasks_v21.sql

      - name: Aplicar migração aditiva de memória no D1 remoto
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f856fa8ecd90e4f82fb42d0732c7f723
        run: npx --yes wrangler@4 d1 execute james-memory --remote --file=migrations/0003_james_memories_v21.sql

      - name: Confirmar tabelas e índices no D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f856fa8ecd90e4f82fb42d0732c7f723
        run: |
          npx --yes wrangler@4 d1 execute james-memory --remote --command "SELECT name, type FROM sqlite_master WHERE name IN ('james_conversation_messages_v21','idx_james_conversation_messages_v21_session_id','james_tasks_v21','idx_james_tasks_v21_session_status','james_memories_v21','idx_james_memories_v21_session') ORDER BY type, name;"

      - name: Publicar Worker validado por testes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f856fa8ecd90e4f82fb42d0732c7f723
        run: npx --yes wrangler@4 deploy

      - name: Testar saúde, histórico, tarefas e memórias do Worker
        env:
          WORKER_URL: https://james-ai.systemjames01.workers.dev
          APP_ORIGIN: https://systemjames01-ship-it.github.io
          TEST_SESSION: ci_check_${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.WORKER_URL;
          const headers = { Origin: process.env.APP_ORIGIN };
          const healthResponse = await fetch(base, { headers });
          if (!healthResponse.ok) throw new Error(`Health check HTTP ${healthResponse.status}`);
          const health = await healthResponse.json();
          if (health.status !== "online" || health.service !== "Jâmes AI Worker") {
            throw new Error("Resposta de saúde inesperada: " + JSON.stringify(health));
          }
          if (!health.databaseConfigured || !health.aiConfigured) {
            throw new Error("Worker sem D1 ou chave Gemini configurados: " + JSON.stringify(health));
          }
          console.log("Health check confirmado; D1 e IA configurados.");

          async function checkList(action, key) {
            const url = new URL(base);
            url.searchParams.set("action", action);
            url.searchParams.set("sessionId", process.env.TEST_SESSION);
            const response = await fetch(url, { headers });
            const data = await response.json();
            if (!response.ok || !Array.isArray(data[key])) {
              throw new Error(`Leitura ${action} falhou: HTTP ${response.status} ` + JSON.stringify(data));
            }
            console.log(`Leitura ${action} confirmada.`);
          }

          await checkList("history", "messages");
          await checkList("tasks", "tasks");
          await checkList("memories", "memories");
          NODE

      - name: Registrar resumo sem segredos
        if: always()
        run: |
          echo "Commit publicado: ${{ github.sha }}"
          echo "Migrações: 0001 histórico, 0002 tarefas e 0003 memórias."
          echo "Worker: james-ai (commit validado em main)"
          echo "Nenhum segredo é exibido por este workflow."
