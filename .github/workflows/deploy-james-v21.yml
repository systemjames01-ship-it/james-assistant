name: Deploy Jâmes to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Digite exatamente DEPLOY_JAMES_AI_V22 para autorizar a publicação"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: james-ai-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirm_production == 'DEPLOY_JAMES_AI_V22' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do commit validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar código e testes
        run: npm test

      - name: Conferir credenciais sem exibi-las
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f856fa8ecd90e4f82fb42d0732c7f723
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Falta o segredo CLOUDFLARE_API_TOKEN no GitHub."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Falta o CLOUDFLARE_ACCOUNT_ID no ambiente do workflow."; exit 1; }
          echo "Credenciais presentes; valores ocultos."

      - name: Aplicar migração aditiva de tarefas no D1 remoto
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f856fa8ecd90e4f82fb42d0732c7f723
        run: npx --yes wrangler@4.135.0 d1 execute james-memory --remote --file=migrations/0002_james_tasks_v21.sql

      - name: Aplicar migração aditiva de memória no D1 remoto
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f856fa8ecd90e4f82fb42d0732c7f723
        run: npx --yes wrangler@4.135.0 d1 execute james-memory --remote --file=migrations/0003_james_memories_v21.sql

      - name: Aplicar índice compartilhado de conversas e limite de requisições no D1 remoto
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f856fa8ecd90e4f82fb42d0732c7f723
        run: npx --yes wrangler@4.135.0 d1 execute james-memory --remote --file=migrations/0004_james_profile_conversations_v21.sql

      - name: Confirmar tabelas e índices no D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f856fa8ecd90e4f82fb42d0732c7f723
        run: |
          npx --yes wrangler@4.135.0 d1 execute james-memory --remote --command "SELECT name, type FROM sqlite_master WHERE name IN ('james_tasks_v21','idx_james_tasks_v21_session_status','james_memories_v21','idx_james_memories_v21_session','james_profile_conversations_v21','idx_james_profile_conversations_profile_updated','james_request_rate_limits') ORDER BY type, name;"

      - name: Publicar Worker validado por testes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f856fa8ecd90e4f82fb42d0732c7f723
        run: npx --yes wrangler@4.135.0 deploy

      - name: Testar saúde do Worker e leitura das tarefas
        env:
          WORKER_URL: https://james-ai.systemjames01.workers.dev
          APP_ORIGIN: https://systemjames01-ship-it.github.io
          TEST_SESSION: ci_check_${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.WORKER_URL;
          const headers = { Origin: process.env.APP_ORIGIN };
          const healthResponse = await fetch(base, { headers });
          if (!healthResponse.ok) throw new Error(`Health check HTTP ${healthResponse.status}`);
          const health = await healthResponse.json();
          if (health.status !== "online" || health.service !== "Jâmes AI Worker") {
            throw new Error("Resposta de saúde inesperada: " + JSON.stringify(health));
          }
          console.log("Health check confirmado:", JSON.stringify(health));

          const profileId = "ci_profile_" + process.env.GITHUB_RUN_ID;
          const tasksUrl = new URL(base);
          tasksUrl.searchParams.set("action", "tasks");
          tasksUrl.searchParams.set("profileId", profileId);
          const tasksResponse = await fetch(tasksUrl, { headers });
          const tasks = await tasksResponse.json();
          if (!tasksResponse.ok || !Array.isArray(tasks.tasks)) {
            throw new Error("Leitura D1 de tarefas falhou: HTTP " + tasksResponse.status + " " + JSON.stringify(tasks));
          }
          console.log("Leitura D1 de tarefas confirmada; quantidade:", tasks.tasks.length);

          const memoriesUrl = new URL(base);
          memoriesUrl.searchParams.set("action", "memories");
          memoriesUrl.searchParams.set("profileId", profileId);
          const memoriesResponse = await fetch(memoriesUrl, { headers });
          const memories = await memoriesResponse.json();
          if (!memoriesResponse.ok || !Array.isArray(memories.memories)) {
            throw new Error("Leitura D1 de memória falhou: HTTP " + memoriesResponse.status + " " + JSON.stringify(memories));
          }
          console.log("Leitura D1 de memória confirmada; quantidade:", memories.memories.length);

          const conversationsUrl = new URL(base);
          conversationsUrl.searchParams.set("action", "conversations");
          conversationsUrl.searchParams.set("profileId", profileId);
          const conversationsResponse = await fetch(conversationsUrl, { headers });
          const conversations = await conversationsResponse.json();
          if (!conversationsResponse.ok || !Array.isArray(conversations.conversations)) {
            throw new Error("Leitura D1 do índice de conversas falhou: HTTP " + conversationsResponse.status + " " + JSON.stringify(conversations));
          }
          console.log("Índice D1 de conversas confirmado; quantidade:", conversations.conversations.length);
          NODE

      - name: Registrar resumo sem segredos
        if: always()
        run: |
          echo "Commit publicado: ${{ github.sha }}"
          echo "Migrações: migrations/0002_james_tasks_v21.sql, 0003_james_memories_v21.sql e 0004_james_profile_conversations_v21.sql"
          echo "Worker: james-ai (commit validado em main)"
          echo "Nenhum segredo é exibido por este workflow."
