name: Diagnose Cloudflare Worker preview build

on:
  push:
    branches:
      - james-jarvis-transformation
    paths:
      - .github/workflows/cloudflare-build-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve failed build logs without exposing credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: f856fa8ecd90e4f82fb42d0732c7f723
          CF_BUILD_ID: 0f3d5606-fc98-4fc4-9466-4f3189428f54
        shell: bash
        run: |
          set +x
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN or CF_API_TOKEN repository secret is configured. No Cloudflare request was made."
            exit 0
          fi

          response="$(curl --silent --show-error --fail \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/builds/builds/$CF_BUILD_ID/logs" \
            --header "Authorization: Bearer $CF_API_TOKEN")" || {
              echo "::error::Cloudflare Build Logs API request failed. Check that the token has Workers CI Read permission."
              exit 1
            }

          success="$(printf '%s' "$response" | jq -r '.success // false')"
          if [ "$success" != "true" ]; then
            printf '%s' "$response" | jq -r '.errors[]?.message // .messages[]? // "Unknown Cloudflare API error"'
            exit 1
          fi

          printf '%s' "$response" | jq -r '
            .result.lines[]?
            | if type == "array" then (.[1] // .[0] // "") else . end
          ' | tail -n 180 | sed -E \
            -e 's/(GEMINI_API_KEY|CLOUDFLARE_API_TOKEN|CF_API_TOKEN)([=: ]+)[^ ]+/\1\2[REDACTED]/g' \
            -e 's/Bearer [A-Za-z0-9._-]+/Bearer [REDACTED]/g'
