name: Validate Jâmes frontend

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/**

permissions:
  contents: read

jobs:
  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline frontend JavaScript
        run: node scripts/check-frontend.mjs
