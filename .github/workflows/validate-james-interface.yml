name: Validate Jâmes interface
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/james-three-mode-command-center]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
