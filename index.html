
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Jâmes — Assistente Pessoal</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#eaf2ff;font:16px Arial,sans-serif}
main{max-width:760px;margin:auto;padding:20px}
header,section{background:#101d30;border:1px solid #263953;border-radius:16px;padding:16px;margin-bottom:14px}
h1{margin:0;color:#75e6ff}
.small{color:#a8bdd5;font-size:13px}
#status{color:#75e6ff;margin:12px 0}
#chat{min-height:180px;max-height:42vh;overflow:auto}
.msg{padding:12px;margin:8px 0;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#183b5b}
.bot{background:#17283e}
textarea,input{width:100%;padding:13px;border-radius:10px;border:1px solid #38516e;background:#091525;color:white;font:inherit}
textarea{min-height:75px;resize:vertical}
button{padding:12px;border:0;border-radius:10px;background:#75e6ff;color:#07111f;font-weight:bold;margin:5px 4px 5px 0}
button.secondary{background:#29405b;color:white}
.row{display:flex;flex-wrap:wrap;gap:6px}
.row button{flex:1}
</style>
</head>
<body>
<main>
<header>
<h1>Jâmes</h1>
<p>Seu assistente pessoal inteligente</p>
<div class="small">Criado por Jamerson Ramos</div>
<div id="status">Pronto para conversar.</div>
</header>

<section>
<h2>Conversa</h2>
<div id="chat" aria-live="polite">
<div class="msg bot">Olá! Sou o Jâmes. Vamos conversar?</div>
</div>
<form id="form">
<textarea id="prompt" placeholder="Escreva sua mensagem..." required></textarea>
<div class="row">
<button type="submit" id="send">Enviar</button>
<button type="button" class="secondary" id="voice">Falar</button>
<button type="button" class="secondary" id="stop">Parar voz</button>
</div>
</form>
</section>

<section>
<h2>Minhas notas</h2>
<textarea id="notes" placeholder="Escreva suas notas aqui..."></textarea>
<div class="row">
<button type="button" id="save">Salvar notas</button>
<button type="button" class="secondary" id="clear">Apagar notas</button>
</div>
<p class="small">As notas ficam guardadas neste navegador.</p>
</section>
</main>

<script>
const WORKER_URL="https://james-ai.systemjames01.workers.dev";
const $=id=>document.getElementById(id);
const chat=$("chat");
const statusBox=$("status");

function addMessage(text,who){
 const div=document.createElement("div");
 div.className="msg "+who;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function speak(text){
 if(!("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="pt-BR";
 speechSynthesis.speak(utterance);
}

async function sendMessage(message){
 const text=message.trim();
 if(!text)return;

 addMessage(text,"user");
 $("prompt").value="";
 $("send").disabled=true;
 statusBox.textContent="Jâmes está pensando...";

 try{
  const response=await fetch(WORKER_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:text})
  });

  const data=await response.json().catch(()=>({}));
  if(!response.ok){
   throw new Error(data.error||data.reply||("Erro HTTP "+response.status));
  }
  if(!data.reply)throw new Error("A IA não retornou uma resposta.");

  addMessage(data.reply,"bot");
  statusBox.textContent="Conectado à IA.";
 }catch(error){
  const message=error.message||"Erro desconhecido.";
  addMessage("Não consegui falar com a IA. Verifique a conexão e o Worker do Cloudflare. Detalhe: "+message,"bot");
  statusBox.textContent="Falha na conexão com a IA.";
 }finally{
  $("send").disabled=false;
 }
}

$("form").addEventListener("submit",event=>{
 event.preventDefault();
 sendMessage($("prompt").value);
});

$("stop").addEventListener("click",()=>{
 if("speechSynthesis" in window)speechSynthesis.cancel();
});

$("save").addEventListener("click",()=>{
 try{
  localStorage.setItem("james_notes",$("notes").value);
  statusBox.textContent="Notas salvas neste navegador.";
 }catch(e){
  statusBox.textContent="Não foi possível salvar as notas.";
 }
});

$("clear").addEventListener("click",()=>{
 if(confirm("Deseja apagar todas as notas?")){
  $("notes").value="";
  localStorage.removeItem("james_notes");
  statusBox.textContent="Notas apagadas.";
 }
});

try{
 $("notes").value=localStorage.getItem("james_notes")||"";
}catch(e){}

$("voice").addEventListener("click",()=>{
 const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Recognition){
  statusBox.textContent="O reconhecimento de voz não está disponível neste navegador.";
  return;
 }
 const recognition=new Recognition();
 recognition.lang="pt-BR";
 recognition.onstart=()=>statusBox.textContent="Estou ouvindo...";
 recognition.onerror=()=>statusBox.textContent="Não consegui reconhecer a voz. Tente novamente.";
 recognition.onresult=event=>{
  const text=event.results[0][0].transcript;
  $("prompt").value=text;
  sendMessage(text);
 };
 recognition.onend=()=>{
  if(statusBox.textContent==="Estou ouvindo...")statusBox.textContent="Pronto.";
 };
 recognition.start();
});
</script>
</body>
</html>
